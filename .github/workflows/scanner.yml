name: Market Scanner

on:
  schedule:
    # Lunes a viernes cada hora entre las 13:00 y 21:00 UTC (Horario de mercado US)
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch: # Permite ejecución manual desde la pestaña 'Actions'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera la instalación guardando las dependencias en caché

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests python-dotenv

      - name: Run Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py